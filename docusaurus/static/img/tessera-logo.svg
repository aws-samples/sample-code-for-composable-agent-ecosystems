<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 100 300 300" role="img" aria-label="Tessera animated logo">
  <defs>
    <linearGradient id="hg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6c8cff" stop-opacity="0.9"/><stop offset="100%" stop-color="#4f6fdf" stop-opacity="0.7"/></linearGradient>
    <linearGradient id="hg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fb923c" stop-opacity="0.9"/><stop offset="100%" stop-color="#ea580c" stop-opacity="0.7"/></linearGradient>
    <linearGradient id="hg3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/><stop offset="100%" stop-color="#dc2626" stop-opacity="0.7"/></linearGradient>
    <linearGradient id="hg4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/><stop offset="100%" stop-color="#d97706" stop-opacity="0.7"/></linearGradient>
    <linearGradient id="hg5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="100%" stop-color="#0891b2" stop-opacity="0.7"/></linearGradient>
    <style>
      .ts-star { transform-origin: 250px 250px; animation: ts-rotate 3s linear infinite; }
      .ts-tile { opacity: 0.5; transform-box: fill-box; transform-origin: center; animation: ts-pulse 2s ease-in-out infinite; }
      .ts-t1 { animation-delay: 0s; } .ts-t2 { animation-delay: 0.25s; }
      .ts-t3 { animation-delay: 0.5s; } .ts-t4 { animation-delay: 0.75s; }
      .ts-t5 { animation-delay: 1s; } .ts-t6 { animation-delay: 1.25s; }
      .ts-t7 { animation-delay: 1.5s; } .ts-t8 { animation-delay: 1.75s; }
      .ts-jewel { transform-origin: 250px 250px; animation: ts-glow 1.5s ease-in-out infinite alternate; }
      @keyframes ts-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes ts-pulse { 0%, 100% { opacity: 0.4; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
      @keyframes ts-glow { from { filter: drop-shadow(0 0 4px rgba(34,211,238,0.4)); opacity: 0.7; } to { filter: drop-shadow(0 0 12px rgba(34,211,238,0.9)); opacity: 1; } }
    </style>
  </defs>
  <g class="ts-star"><polygon fill="url(#hg5)" stroke="#22d3ee" stroke-width="2" points="250,180 261.5,222.3 299.5,200.5 277.7,238.5 320,250 277.7,261.5 299.5,299.5 261.5,277.7 250,320 238.5,277.7 200.5,299.5 222.3,261.5 180,250 222.3,238.5 200.5,200.5 238.5,222.3"/></g>
