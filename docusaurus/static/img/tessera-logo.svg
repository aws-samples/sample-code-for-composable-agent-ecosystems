  <polygon class="ts-tile ts-t3" fill="url(#hg1)" stroke="#6c8cff" stroke-width="1" points="315,250 337.2,227.7 390,250 337.2,272.3"/>
  <polygon class="ts-tile ts-t4" fill="url(#hg2)" stroke="#fb923c" stroke-width="1" points="296,296 327.4,295.9 349,349 295.9,327.4"/>
  <polygon class="ts-tile ts-t5" fill="url(#hg2)" stroke="#fb923c" stroke-width="1" points="250,315 272.3,337.2 250,390 227.7,337.2"/>
  <polygon class="ts-tile ts-t6" fill="url(#hg4)" stroke="#fbbf24" stroke-width="1" points="204,296 204.1,327.4 151,349 172.6,295.9"/>
  <polygon class="ts-tile ts-t7" fill="url(#hg3)" stroke="#ef4444" stroke-width="1" points="185,250 162.8,272.3 110,250 162.8,227.7"/>
  <polygon class="ts-tile ts-t8" fill="url(#hg3)" stroke="#ef4444" stroke-width="1" points="204,204 172.6,204.1 151,151 204.1,172.6"/>
  <circle class="ts-jewel" cx="250" cy="250" r="8" fill="#22d3ee" opacity="0.8"/>
