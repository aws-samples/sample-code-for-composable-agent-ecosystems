<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Tessera — multi-agent AI workflows on AWS, declared in YAML">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/><stop offset="0.33" stop-color="#01A88D"/>
      <stop offset="0.66" stop-color="#E8820C"/><stop offset="1" stop-color="#E7157B"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6c8cff" stop-opacity="0.9"/><stop offset="100%" stop-color="#4f6fdf" stop-opacity="0.7"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fb923c" stop-opacity="0.9"/><stop offset="100%" stop-color="#ea580c" stop-opacity="0.7"/></linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/><stop offset="100%" stop-color="#dc2626" stop-opacity="0.7"/></linearGradient>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fbbf24" stop-opacity="0.9"/><stop offset="100%" stop-color="#d97706" stop-opacity="0.7"/></linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/><stop offset="100%" stop-color="#0891b2" stop-opacity="0.7"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B2733" flood-opacity="0.16"/></filter>
    <symbol id="i-agent" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><rect x="8" y="11" width="16" height="12" rx="3"/><path d="M16 11V7M16 7a2 2 0 1 0 0-.1" stroke-linecap="round"/><circle cx="13" cy="17" r="1.5" fill="#fff" stroke="none"/><circle cx="19" cy="17" r="1.5" fill="#fff" stroke="none"/></g></symbol>
    <symbol id="i-merge" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7v4c0 3 3 5 7 5s7 2 7 5v4"/><path d="M9 7l-3 3M9 7l3 3"/><path d="M23 7v4c0 3-3 5-7 5"/><path d="M23 25l-3-3M23 25l3-3"/></g></symbol>
    <symbol id="i-shieldcheck" viewBox="0 0 32 32"><path d="M16 5l9 4v6c0 6-4 9.3-9 11-5-1.7-9-5-9-11V9Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 15.5l3 3 5.5-5.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-doc" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M9 5h10l5 5v17H9Z"/><path d="M19 5v5h5"/><path d="M12 15h8M12 19h8M12 23h5" stroke-linecap="round"/></g></symbol>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="#FBFCFD"/>
  <rect width="1280" height="10" fill="url(#accent)"/>
  <rect x="0" y="630" width="1280" height="10" fill="#F1F4F8"/>

  <!-- ===== LEFT: brand + value prop ===== -->
  <!-- mark (official Tessera logo) -->
  <g transform="translate(74,54) scale(0.28) translate(-100,-100)">
    <polygon fill="url(#g5)" stroke="#22d3ee" stroke-width="2" points="250,180 261.5,222.3 299.5,200.5 277.7,238.5 320,250 277.7,261.5 299.5,299.5 261.5,277.7 250,320 238.5,277.7 200.5,299.5 222.3,261.5 180,250 222.3,238.5 200.5,200.5 238.5,222.3"/>
    <polygon fill="url(#g1)" stroke="#6c8cff" stroke-width="1" points="250,185 227.7,162.8 250,110 272.3,162.8"/>
    <polygon fill="url(#g1)" stroke="#6c8cff" stroke-width="1" points="315,250 337.2,227.7 390,250 337.2,272.3"/>
    <polygon fill="url(#g2)" stroke="#fb923c" stroke-width="1" points="250,315 272.3,337.2 250,390 227.7,337.2"/>
    <polygon fill="url(#g3)" stroke="#ef4444" stroke-width="1" points="185,250 162.8,272.3 110,250 162.8,227.7"/>
    <polygon fill="url(#g4)" stroke="#fbbf24" stroke-width="1" points="296,204 295.9,172.6 349,151 327.4,204.1"/>
    <polygon fill="url(#g4)" stroke="#fbbf24" stroke-width="1" points="204,296 204.1,327.4 151,349 172.6,295.9"/>
    <polygon fill="url(#g3)" stroke="#ef4444" stroke-width="1" points="204,204 172.6,204.1 151,151 204.1,172.6"/>
    <polygon fill="url(#g2)" stroke="#fb923c" stroke-width="1" points="296,296 327.4,295.9 349,349 295.9,327.4"/>
    <circle cx="250" cy="250" r="8" fill="#22d3ee" opacity="0.8"/>
    <circle cx="250" cy="250" r="3.5" fill="#fff" opacity="0.95"/>
  </g>
  <text x="190" y="112" font-size="58" font-weight="800" fill="#0F1B2D">Tessera</text>

  <!-- tagline -->
  <text x="80" y="212" font-size="40" font-weight="800" fill="#15232F">Multi-agent AI workflows</text>
  <text x="80" y="262" font-size="40" font-weight="800" fill="#15232F">on AWS, <tspan fill="#6366F1">declared in YAML</tspan>.</text>

  <!-- sub -->
  <text x="82" y="312" font-size="21" fill="#5B6B7A">Compiled to AWS Step Functions · run on</text>
  <text x="82" y="342" font-size="21" fill="#5B6B7A">Amazon Bedrock AgentCore · live generative UI.</text>

  <!-- tech pills -->
  <g font-size="17" font-weight="700">
    <g transform="translate(80,392)"><rect width="150" height="38" rx="19" fill="#F0F0FE" stroke="#D7D8F7"/><text x="75" y="25" text-anchor="middle" fill="#4A4FCF">Terraform</text></g>
    <g transform="translate(242,392)"><rect width="196" height="38" rx="19" fill="#FFF3E6" stroke="#F6D9B5"/><text x="98" y="25" text-anchor="middle" fill="#B5700A">Bedrock AgentCore</text></g>
    <g transform="translate(450,392)"><rect width="176" height="38" rx="19" fill="#FDE9F3" stroke="#F6C3DF"/><text x="88" y="25" text-anchor="middle" fill="#C01574">Step Functions</text></g>
  </g>

  <!-- bottom trust strip -->
  <g transform="translate(80,560)">
    <text x="0" y="0" font-size="18" font-weight="700" fill="#15232F">AWS Samples</text>
    <text x="138" y="0" font-size="18" fill="#8A99A8">· MIT-0 · Terraform + Amazon Bedrock AgentCore</text>
  </g>

  <!-- divider -->
  <line x1="740" y1="90" x2="740" y2="550" stroke="#E6EBF0" stroke-width="2"/>

  <!-- ===== RIGHT: mini execution graph ===== -->
  <!-- connectors -->
  <g stroke="#C3CCD6" stroke-width="2.5" fill="none">
    <path d="M860 196 C 860 250, 1000 250, 1000 286"/>
    <path d="M1000 196 L1000 286"/>
    <path d="M1140 196 C 1140 250, 1000 250, 1000 286"/>
    <path d="M1000 350 L1000 406"/>
    <path d="M1000 470 L1000 526"/>
  </g>

  <!-- research swarm (3 amber nodes) -->
  <g filter="url(#s)">
    <rect x="820" y="152" width="80" height="44" rx="12" fill="#E8820C"/><use href="#i-agent" x="844" y="162" width="32" height="32"/>
    <rect x="960" y="152" width="80" height="44" rx="12" fill="#E8820C"/><use href="#i-agent" x="984" y="162" width="32" height="32"/>
    <rect x="1100" y="152" width="80" height="44" rx="12" fill="#E8820C"/><use href="#i-agent" x="1124" y="162" width="32" height="32"/>
  </g>
  <text x="1000" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#B5700A">research swarm · parallel</text>

  <!-- synthesizer -->
  <g filter="url(#s)"><rect x="930" y="286" width="140" height="52" rx="13" fill="#01A88D"/><use href="#i-merge" x="946" y="298" width="28" height="28"/><text x="1012" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">synthesize</text></g>
  <!-- challenger -->
  <g filter="url(#s)"><rect x="930" y="406" width="140" height="52" rx="13" fill="#DD344C"/><use href="#i-shieldcheck" x="946" y="418" width="28" height="28"/><text x="1012" y="438" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">challenge</text></g>
  <!-- report -->
  <g filter="url(#s)"><rect x="930" y="526" width="140" height="52" rx="13" fill="#475569"/><use href="#i-doc" x="946" y="538" width="28" height="28"/><text x="1012" y="558" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">report</text></g>
</svg>
