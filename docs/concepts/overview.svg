<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 780" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Tessera core concepts and how they relate">
  <defs>
    <style>
      .h1{font-size:26px;font-weight:800;fill:#0F1B2D}
      .sb{font-size:13px;fill:#64748B}
      .ct{font-size:15px;font-weight:700;fill:#15232F}
      .cs{font-size:11px;fill:#5B6B7A}
      .tag{font-size:10.5px;font-weight:600;fill:#5A6B7B}
      .vlab{font-size:11px;font-weight:700;fill:#64748B}
      .kic{font-size:11px;font-weight:700;letter-spacing:.4px}
      .foot{font-size:11px;fill:#8A99A8}
    </style>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.4" flood-color="#1B2733" flood-opacity="0.14"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5A6B7B"/></marker>
    <marker id="ard" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9AA7B4"/></marker>
    <symbol id="i-domain" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M16 6l10 5-10 5-10-5Z"/><path d="M6 16l10 5 10-5"/><path d="M6 21l10 5 10-5"/></g></symbol>
    <symbol id="i-catalog" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2"><ellipse cx="16" cy="9" rx="9" ry="3"/><path d="M7 9v14c0 1.7 18 1.7 18 0V9"/><path d="M7 16c0 1.7 18 1.7 18 0"/></g></symbol>
    <symbol id="i-yaml" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M9 5h10l5 5v17H9Z"/><path d="M19 5v5h5"/><path d="M12 16h8M12 20h8M12 23h5" stroke-linecap="round"/></g></symbol>
    <symbol id="i-run" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><circle cx="16" cy="16" r="10"/><path d="M13 11l7 5-7 5Z" fill="#fff" stroke="none"/></g></symbol>
    <symbol id="i-agent" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><rect x="8" y="11" width="16" height="12" rx="3"/><path d="M16 11V7M16 7a2 2 0 1 0 0-.1" stroke-linecap="round"/><circle cx="13" cy="17" r="1.4" fill="#fff" stroke="none"/><circle cx="19" cy="17" r="1.4" fill="#fff" stroke="none"/></g></symbol>
    <symbol id="i-mem" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><rect x="9" y="9" width="14" height="14" rx="2"/><path d="M13 6v3M19 6v3M13 23v3M19 23v3M6 13h3M6 19h3M23 13h3M23 19h3"/></g></symbol>
    <symbol id="i-shieldcheck" viewBox="0 0 32 32"><path d="M16 5l9 4v6c0 6-4 9.3-9 11-5-1.7-9-5-9-11V9Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M12 15.5l3 3 5.5-5.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><circle cx="16" cy="16" r="4"/><path d="M16 6v3M16 23v3M6 16h3M23 16h3M9 9l2 2M21 21l2 2M23 9l-2 2M11 21l-2 2"/></g></symbol>
    <symbol id="i-doc" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M9 5h10l5 5v17H9Z"/><path d="M19 5v5h5"/><path d="M12 15h8M12 19h8M12 23h5" stroke-linecap="round"/></g></symbol>
  </defs>

  <rect x="8" y="8" width="1304" height="764" rx="18" fill="#FBFCFD" stroke="#E6EBF0"/>
  <text x="40" y="46" class="h1">How Tessera fits together</text>
  <text x="40" y="70" class="sb">The core concepts and the two tracks that connect them &#8212; a <tspan font-weight="700" fill="#4C9A2A">knowledge</tspan> track that grounds a <tspan font-weight="700" fill="#6366F1">build &#38; run</tspan> track.</text>

  <!-- ===================== KNOWLEDGE TRACK (top) ===================== -->
  <rect x="300" y="104" width="720" height="150" rx="16" fill="#F4FAF0" stroke="#CDE8BE" stroke-dasharray="5 4"/>
  <text x="320" y="128" class="kic" fill="#3C7A1E">KNOWLEDGE &#8212; grounded, versioned, cited</text>

  <!-- Domain -->
  <g transform="translate(330,146)" filter="url(#sh)">
    <rect width="300" height="92" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="16" y="18" width="40" height="40" rx="9" fill="#3B6FD4"/><use href="#i-domain" x="20" y="22" width="32" height="32"/>
    <text class="ct" x="70" y="40">Domain</text>
    <text class="cs" x="70" y="60">a knowledge area &#183; declares curated</text>
    <text class="cs" x="70" y="75">sources, ingest config &#38; refresh cadence</text>
  </g>
  <!-- Catalog -->
  <g transform="translate(690,146)" filter="url(#sh)">
    <rect width="300" height="92" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="16" y="18" width="40" height="40" rx="9" fill="#4C9A2A"/><use href="#i-catalog" x="20" y="22" width="32" height="32"/>
    <text class="ct" x="70" y="40">Catalog</text>
    <text class="cs" x="70" y="60">versioned store of grounded records</text>
    <text class="cs" x="70" y="75">agents cite via <tspan font-family="ui-monospace,monospace" fill="#3C7A1E">/catalog/&#8230;</tspan> namespaces</text>
  </g>
  <!-- domain -> catalog -->
  <path d="M630 192 H690" fill="none" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ar)"/>
  <text x="660" y="184" class="vlab" text-anchor="middle">ingest</text>

  <!-- ===================== BUILD & RUN SPINE (middle) ===================== -->
  <rect x="40" y="330" width="1240" height="168" rx="16" fill="#F2F3FD" stroke="#CFD3F6" stroke-dasharray="5 4"/>
  <text x="60" y="354" class="kic" fill="#4A4FCF">BUILD &#38; RUN &#8212; YAML compiled to a live multi-agent pipeline</text>

  <!-- Ecosystem -->
  <g transform="translate(60,372)" filter="url(#sh)">
    <rect width="212" height="104" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="14" y="16" width="38" height="38" rx="9" fill="#6366F1"/><use href="#i-yaml" x="17" y="19" width="32" height="32"/>
    <text class="ct" x="62" y="37">Ecosystem</text>
    <text class="cs" x="62" y="55">a YAML workflow:</text>
    <text class="cs" x="14" y="76">inputs &#183; strategy &#183; agents &#183;</text>
    <text class="cs" x="14" y="91">swarms &#183; memory &#183; quality</text>
  </g>
  <!-- Compiler -->
  <g transform="translate(316,386)" filter="url(#sh)">
    <rect width="168" height="76" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="14" y="18" width="38" height="38" rx="9" fill="#8A5A2B"/><use href="#i-gear" x="17" y="21" width="32" height="32"/>
    <text class="ct" x="60" y="37">Compiler</text>
    <text class="cs" x="60" y="56">YAML &#8594; ASL</text>
  </g>
  <!-- Step Functions -->
  <g transform="translate(528,372)" filter="url(#sh)">
    <rect width="212" height="104" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="14" y="16" width="38" height="38" rx="9" fill="#E7157B"/><use href="#i-agent" x="17" y="19" width="32" height="32"/>
    <text class="ct" x="62" y="37">Agents &#215; Swarms</text>
    <text class="cs" x="62" y="55">run as a DAG on</text>
    <text class="cs" x="14" y="76">Step Functions &#183; shared</text>
    <text class="cs" x="14" y="91">memory &#183; tools &#183; grounding</text>
  </g>
  <!-- Run -->
  <g transform="translate(784,386)" filter="url(#sh)">
    <rect width="168" height="76" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="14" y="18" width="38" height="38" rx="9" fill="#0EA5A3"/><use href="#i-run" x="17" y="21" width="32" height="32"/>
    <text class="ct" x="60" y="37">Run</text>
    <text class="cs" x="60" y="56">live generative UI</text>
  </g>
  <!-- Report -->
  <g transform="translate(996,372)" filter="url(#sh)">
    <rect width="268" height="104" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="16" y="16" width="38" height="38" rx="9" fill="#475569"/><use href="#i-doc" x="19" y="19" width="32" height="32"/>
    <text class="ct" x="64" y="37">Report / Outcome</text>
    <text class="cs" x="64" y="55">defensible deliverable with</text>
    <text class="cs" x="16" y="76">inline citations &#183; preserved dissent &#183;</text>
    <text class="cs" x="16" y="91">gate-passed &#183; downloadable artifacts</text>
  </g>

  <!-- spine arrows -->
  <g fill="none" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ar)">
    <path d="M272 424 H316"/>
    <path d="M484 424 H528"/>
    <path d="M740 424 H784"/>
    <path d="M952 424 H996"/>
  </g>
  <g class="vlab" text-anchor="middle" fill="#64748B">
    <text x="294" y="416">compile</text>
    <text x="506" y="416">deploy</text>
    <text x="762" y="416">execute</text>
    <text x="974" y="416">produce</text>
  </g>

  <!-- ===================== LINKS between tracks ===================== -->
  <!-- catalog grounds agents -->
  <path d="M820 238 V300 Q820 318 700 318 L640 318 Q634 318 634 330 L634 372" fill="none" stroke="#4C9A2A" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="712" y="312" class="vlab" fill="#3C7A1E" text-anchor="middle">grounds &#183; cited by agents</text>
  <!-- ecosystem references domain -->
  <path d="M150 372 V300 Q150 288 300 288 L430 288 Q452 288 452 266 L452 238" fill="none" stroke="#6366F1" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ard)"/>
  <text x="250" y="282" class="vlab" fill="#4A4FCF" text-anchor="middle">references its domain</text>

  <!-- ===================== CROSS-CUTTING CARDS (bottom) ===================== -->
  <rect x="40" y="548" width="1240" height="150" rx="16" fill="#FCFAFF" stroke="#E7DCF7" stroke-dasharray="5 4"/>
  <text x="60" y="572" class="kic" fill="#7A3FD0">CROSS-CUTTING &#8212; shared across every run</text>

  <g transform="translate(60,590)" filter="url(#sh)">
    <rect width="392" height="88" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="16" y="16" width="38" height="38" rx="9" fill="#8C4FFF"/><use href="#i-mem" x="19" y="19" width="32" height="32"/>
    <text class="ct" x="64" y="37">Memory</text>
    <text class="cs" x="64" y="56">shared namespaces &#183; semantic / episodic strategies</text>
    <text class="cs" x="64" y="72">per-agent read / write ACLs</text>
  </g>
  <g transform="translate(464,590)" filter="url(#sh)">
    <rect width="392" height="88" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="16" y="16" width="38" height="38" rx="9" fill="#DD344C"/><use href="#i-shieldcheck" x="19" y="19" width="32" height="32"/>
    <text class="ct" x="64" y="37">Quality</text>
    <text class="cs" x="64" y="56">challenger agent &#183; internal (Guardrail) + external</text>
    <text class="cs" x="64" y="72">(web search) grounding &#183; gates block weak output</text>
  </g>
  <g transform="translate(868,590)" filter="url(#sh)">
    <rect width="396" height="88" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="16" y="16" width="38" height="38" rx="9" fill="#01A88D"/><use href="#i-agent" x="19" y="19" width="32" height="32"/>
    <text class="ct" x="64" y="37">Tools &#38; Archetypes</text>
    <text class="cs" x="64" y="56">web_search, memory, code_interpreter, generateUI&#8230;</text>
    <text class="cs" x="64" y="72">each agent has an <tspan font-family="ui-monospace,monospace">output_kind</tspan> contract</text>
  </g>

  <text x="40" y="738" class="foot">Author once in YAML &#183; the same engine runs a finance advisor, a trading desk, a risk board, a security war-room, or a trip planner &#8212; what differs is the config, not the code.</text>
</svg>
