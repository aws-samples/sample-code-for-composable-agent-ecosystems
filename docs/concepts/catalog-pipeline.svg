<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 680" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" role="img" aria-label="Tessera catalog build pipeline: sources to versioned, grounded, cited records">
  <defs>
    <style>
      .h1{font-size:26px;font-weight:800;fill:#0F1B2D}
      .sb{font-size:13px;fill:#64748B}
      .kic{font-size:11px;font-weight:700;letter-spacing:.4px}
      .ct{font-size:14px;font-weight:700;fill:#15232F}
      .cs{font-size:10.5px;fill:#5B6B7A}
      .vlab{font-size:10.5px;font-weight:700;fill:#64748B}
      .pill{font-size:11px;font-weight:600;fill:#334155}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .foot{font-size:11px;fill:#8A99A8}
    </style>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-color="#1B2733" flood-opacity="0.14"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5A6B7B"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#4C9A2A"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B98900"/></marker>
    <symbol id="i-src" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M16 6l10 5-10 5-10-5Z"/><path d="M6 16l10 5 10-5"/><path d="M6 21l10 5 10-5"/></g></symbol>
    <symbol id="i-dl" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 6v13M11 15l5 5 5-5"/><path d="M7 24h18"/></g></symbol>
    <symbol id="i-merge" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7v4c0 3 3 5 7 5s7 2 7 5v4"/><path d="M9 7l-3 3M9 7l3 3"/><path d="M23 7v4c0 3-3 5-7 5"/><path d="M23 25l-3-3M23 25l3-3"/></g></symbol>
    <symbol id="i-check" viewBox="0 0 32 32"><path d="M16 5l9 4v6c0 6-4 9.3-9 11-5-1.7-9-5-9-11V9Z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M12 15.5l3 3 5.5-5.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-up" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 25V9M9 16l7-7 7 7"/></g></symbol>
    <symbol id="i-catalog" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2"><ellipse cx="16" cy="9" rx="9" ry="3"/><path d="M7 9v14c0 1.7 18 1.7 18 0V9"/><path d="M7 16c0 1.7 18 1.7 18 0"/></g></symbol>
    <symbol id="i-agent" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><rect x="8" y="11" width="16" height="12" rx="3"/><path d="M16 11V7M16 7a2 2 0 1 0 0-.1" stroke-linecap="round"/><circle cx="13" cy="17" r="1.4" fill="#fff" stroke="none"/><circle cx="19" cy="17" r="1.4" fill="#fff" stroke="none"/></g></symbol>
    <symbol id="i-refresh" viewBox="0 0 32 32"><g fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M25 9a11 11 0 1 0 2 9"/><path d="M25 5v5h-5"/></g></symbol>
  </defs>

  <rect x="8" y="8" width="1324" height="664" rx="18" fill="#FBFCFD" stroke="#E6EBF0"/>
  <text x="40" y="46" class="h1">The catalog: grounded, versioned, cited</text>
  <text x="40" y="70" class="sb">A per-domain Step Functions pipeline turns curated sources into version-pinned records. Agents cite them &#8212; nothing is promoted until the coverage gate passes.</text>

  <!-- ============ BUILD LANE ============ -->
  <rect x="40" y="104" width="1260" height="250" rx="14" fill="#F4FAF0" stroke="#CDE8BE" stroke-dasharray="5 4"/>
  <text x="60" y="128" class="kic" fill="#3C7A1E">CATALOG BUILD &#8212; per domain &#183; AWS Step Functions &#183; idempotent</text>

  <!-- Sources -->
  <g filter="url(#sh)">
    <rect x="60" y="150" width="182" height="168" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="78" y="168" width="40" height="40" rx="9" fill="#4C9A2A"/><use href="#i-src" x="82" y="172" width="32" height="32"/>
    <text class="ct" x="78" y="232">Curated sources</text>
    <text class="cs" x="78" y="252">regulatory feeds, PDFs,</text>
    <text class="cs" x="78" y="267">seed files</text>
    <text class="cs" x="78" y="289" fill="#3C7A1E">declared in</text>
    <text class="cs mono" x="78" y="303" fill="#3C7A1E">domains/&#8230;/catalog.yaml</text>
  </g>
  <path d="M242 234 H270" fill="none" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Ingest -->
  <g filter="url(#sh)">
    <rect x="272" y="150" width="320" height="168" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="290" y="166" width="34" height="34" rx="8" fill="#3B6FD4"/><use href="#i-dl" x="293" y="169" width="28" height="28"/>
    <text class="ct" x="334" y="182">Ingest</text><text class="cs" x="334" y="197">per source &#183; in-process</text>
    <g>
      <rect x="290" y="212" width="284" height="28" rx="8" fill="#F1F6FD" stroke="#D4E3F6"/><text class="pill" x="304" y="230"><tspan font-weight="700">fetch</tspan>  &#183;  s3 / http feed / PDF</text>
      <rect x="290" y="246" width="284" height="28" rx="8" fill="#F1F6FD" stroke="#D4E3F6"/><text class="pill" x="304" y="264"><tspan font-weight="700">normalize</tspan>  &#183;  map / schema &#8594; records</text>
      <rect x="290" y="280" width="284" height="28" rx="8" fill="#F1F6FD" stroke="#D4E3F6"/><text class="pill" x="304" y="298"><tspan font-weight="700">diff-upsert</tspan>  &#183;  add / update / deprecate</text>
    </g>
  </g>
  <path d="M592 234 H624" fill="none" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Synthesis -->
  <g filter="url(#sh)">
    <rect x="624" y="150" width="196" height="168" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="642" y="168" width="40" height="40" rx="9" fill="#01A88D"/><use href="#i-merge" x="646" y="172" width="32" height="32"/>
    <text class="ct" x="642" y="232">Synthesis</text>
    <text class="cs" x="642" y="252">per-cluster Map &#8212; an LLM</text>
    <text class="cs" x="642" y="267">reconciles into new records</text>
    <text class="cs" x="642" y="289" fill="#018069">only for</text>
    <text class="cs mono" x="642" y="303" fill="#018069">synthesis: true</text>
  </g>
  <path d="M820 234 H852" fill="none" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Validate -->
  <g filter="url(#sh)">
    <rect x="852" y="150" width="196" height="168" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="870" y="168" width="40" height="40" rx="9" fill="#E8820C"/><use href="#i-check" x="874" y="172" width="32" height="32"/>
    <text class="ct" x="870" y="232">Validate</text>
    <text class="cs" x="870" y="252">coverage gate checks the</text>
    <text class="cs" x="870" y="267">new version is complete</text>
    <text class="cs" x="870" y="289" fill="#B5700A">incomplete &#8594; NOT</text>
    <text class="cs" x="870" y="303" fill="#B5700A">promoted (fail-closed)</text>
  </g>
  <path d="M1048 234 H1074" fill="none" stroke="#5A6B7B" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Promote -->
  <g filter="url(#sh)">
    <rect x="1074" y="150" width="196" height="168" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="1092" y="168" width="40" height="40" rx="9" fill="#6366F1"/><use href="#i-up" x="1096" y="172" width="32" height="32"/>
    <text class="ct" x="1092" y="232">Promote</text>
    <text class="cs" x="1092" y="252">the new version becomes</text>
    <text class="cs" x="1092" y="267">the active catalog</text>
    <text class="cs mono" x="1092" y="291" fill="#4A4FCF">vN &#8594; active</text>
  </g>

  <!-- refresh loop (top arc) -->
  <path d="M1172 150 V128 Q1172 118 1140 118 L182 118 Q151 118 151 128 L151 150" fill="none" stroke="#4C9A2A" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arg)"/>
  <g transform="translate(600,106)"><rect x="0" y="0" width="190" height="24" rx="12" fill="#EAF6E2" stroke="#C3E3B1"/><rect x="5" y="4" width="16" height="16" rx="4" fill="#4C9A2A"/><use href="#i-refresh" x="5" y="4" width="16" height="16"/><text x="28" y="16" font-size="10.5" font-weight="700" fill="#3C7A1E">scheduled refresh &#183; rate(N days)</text></g>

  <!-- promote -> active catalog routed connector -->
  <path d="M1172 318 V372 Q1172 386 1140 386 L232 386 Q200 386 200 400 L200 428" fill="none" stroke="#6366F1" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/>
  <text x="690" y="380" class="vlab" fill="#4A4FCF" text-anchor="middle">a promoted version becomes the active catalog agents read</text>

  <!-- ============ CONSUMPTION ============ -->
  <text x="40" y="416" class="kic" fill="#C0304A">CONSUMPTION &#8212; grounded &#38; cited at run time</text>

  <!-- Active catalog -->
  <g filter="url(#sh)">
    <rect x="60" y="428" width="300" height="118" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="78" y="446" width="40" height="40" rx="9" fill="#4C9A2A"/><use href="#i-catalog" x="82" y="450" width="32" height="32"/>
    <text class="ct" x="130" y="466">Active catalog vN</text>
    <text class="cs" x="130" y="485">version-pinned records</text>
    <text class="cs mono" x="78" y="520" fill="#3C7A1E">/catalog/&#60;domain&#62;/&#60;type&#62;/&#60;id&#62;</text>
    <text class="cs" x="78" y="536">deterministic &#183; or agent-extracted</text>
  </g>
  <path d="M360 487 H470" fill="none" stroke="#4C9A2A" stroke-width="2" marker-end="url(#arg)"/>
  <text x="415" y="479" class="vlab" fill="#3C7A1E" text-anchor="middle">cite</text>

  <!-- Agent -->
  <g filter="url(#sh)">
    <rect x="470" y="428" width="280" height="118" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="488" y="446" width="40" height="40" rx="9" fill="#E7157B"/><use href="#i-agent" x="492" y="450" width="32" height="32"/>
    <text class="ct" x="540" y="466">Any agent</text>
    <text class="cs" x="540" y="485">looks up &#38; cites records</text>
    <text class="cs" x="488" y="520">no citation from memory when the</text>
    <text class="cs" x="488" y="536">catalog holds it &#8212; cite the record</text>
  </g>
  <path d="M750 487 H860" fill="none" stroke="#DD344C" stroke-width="2" marker-end="url(#ar)"/>
  <text x="805" y="479" class="vlab" fill="#C0304A" text-anchor="middle">verify</text>

  <!-- Grounding -->
  <g filter="url(#sh)">
    <rect x="860" y="428" width="410" height="118" rx="13" fill="#fff" stroke="#E2E8F0"/>
    <rect x="878" y="446" width="40" height="40" rx="9" fill="#DD344C"/><use href="#i-check" x="882" y="450" width="32" height="32"/>
    <text class="ct" x="930" y="466">Grounding checks</text>
    <text class="cs" x="930" y="485">claims must hold up against evidence</text>
    <text class="cs" x="878" y="520"><tspan font-weight="700" fill="#C0304A">internal</tspan>: Bedrock Guardrail (contextual grounding)</text>
    <text class="cs" x="878" y="536"><tspan font-weight="700" fill="#C0304A">external</tspan>: web search cross-check</text>
  </g>

  <text x="40" y="612" class="foot">Deterministic sources ingest without an LLM (<tspan class="mono">transport: s3/http</tspan>, <tspan class="mono">normalize: map</tspan>). Prose/PDF taxonomies declare <tspan class="mono">mode: agent</tspan> and are extracted by an agent via <tspan class="mono">make ingest-agent</tspan>.</text>
</svg>
