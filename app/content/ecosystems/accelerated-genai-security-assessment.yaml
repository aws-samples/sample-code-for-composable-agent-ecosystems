    \ as first-class columns feeding Severity; the kit renders an L x I heat map but does not define the\
    \ bands — you must define and publish them).\nAnchor LIKELIHOOD in data, not intuition:\n  - /catalog/risk/rsk-ai-asi01..asi10\
    \ and rsk-ai-llm01..llm10 (LOWERCASE ids on read) each carry frameworks.open_fair.loss_event_frequency\
    \ WITH ITS STATED BASIS. Reuse that basis and cite the record id.\n  - /catalog/ai-incident/ and /catalog/breach/\
    \ give real precedents and base rates. A finding with a documented precedent is materially more likely\
    \ than one without; say which.\nAnchor IMPACT in this workload's blast radius using the phase-1 asset/trust-boundary\
    \ analysis.\nWhere a control is claimed as mitigating, check the evidence actually shows it operating\
