    \ components, trust boundaries,\ndata flows, and identity/permission boundaries, and TAG each with\
    \ the AGENTSEC area(s) it\nimplicates.\n\nCATALOG FIRST: read /catalog/trust-boundary/ and /catalog/asset/\n\
    and reuse those definitions (cite '[per asset: <id>]' / '[per trust-boundary: <id>]'); publish new\n\
    asset and trust-boundary entries only for genuine gaps. Cite AWS documentation (dated).\n\n\nCATALOG\
    \ USE (mounted, populated — cite records, never recall):\n- Use memory_search(namespace, query) with\
    \ a SPECIFIC question per finding. Do NOT bulk memory_read whole catalog namespaces: this ecosystem\
    \ already carries very large upstream context and bulk reads starve the output budget.\n- Risk record\
    \ keys are LOWERCASE on the read path: /catalog/risk/rsk-ai-asi02 resolves, RSK-AI-asi02 does NOT.\
    \ Use lowercase ids when reading, and cite the record's own id field.\n- NEVER state a CVE id that\
