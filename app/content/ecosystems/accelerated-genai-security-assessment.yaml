    \ (rich risk records\ncarrying FAIR quantification, NIST 800-53 control mappings + efficacy, bow-tie,\
    \ decision-tree, and\nboard framing), plus /catalog/ai-attack-technique/ and /agentic-threat/. PREFER\n\
