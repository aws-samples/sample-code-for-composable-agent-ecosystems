    \ with different urgency, and the escalation was sitting in\nthe title all along.\n\nSo for every\
    \ finding:\n  - Quote or preserve the register's full claim, including any \"and X\" / \"which allows\
    \ Y\" /\n    \"returns Z\" clause. If the register names an escalation, an exposure or a blast radius,\n\
    \    that belongs in your text and in your severity reasoning.\n  - Say what the weakness PERMITS\
    \ in this workload, not only what is technically absent.\n    \"No integrity check on tool responses\"\
