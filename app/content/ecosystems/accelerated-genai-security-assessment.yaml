ecosystem:
  name: Accelerated GenAI Security Assessment
  description: 'Accelerated GenAI security assessment for agentic AI workloads on AWS. Anchored on the
    AWS Well-Architected Agentic AI Lens (Security pillar, AGENTSEC01-09), cross-mapped to the OWASP agentic
    threat taxonomy (ASI01-10 + LLM01-10) and the CSA MAESTRO layered model, verified against MITRE ATLAS,
    and grounded in the durable cyber-security-risk catalog. Fails closed if framework grounding is absent.
    Runs in two phases: a design-level assessment kit (questionnaire, test procedures, tooling guide,
    execution playbook, local code-review SOP and a design-workshop deck), then an evidence-based reconciliation
    that emits a self-contained HTML report and stakeholder read-out deck plus editable Word and PowerPoint
    renditions, with a humanizer and a final quality gate before emission.'
  version: '4.0'
phases:
- id: playbook
  name: Phase 1 — Assessment Playbook
  description: 'Design-level review of the target from its architecture documentation, producing the assessment
    KIT: scoped questionnaire, test procedures, tooling guide, findings/report templates and the AGENTSEC
    x ASI coverage skeleton. Assigns NO evidence-based severities: with only design documents there is
    nothing to score against. Its findings are HYPOTHESES to confirm or refute in phase 2.'
  ends_after: playbook_drafter
  inputs:
    required:
    - architecture_doc
    accepts:
      architecture_doc:
      - pdf
      - docx
      - md
      - txt
  produces:
  - aws-ai-security-assessment-kit.html
  - aws-ai-security-assessment-workshop.html
  - aws-ai-security-assessment-questionnaire.xlsx
  - aws-ai-security-assessment-findings-template.xlsx
  - aws-ai-security-assessment-report-template.docx
  - aws-ai-security-assessment-execution-playbook.xlsx
  - agentic-code-review.sop.md
- id: report
  name: Phase 2 — Findings Reconciliation & Report
  description: Consumes the evidence gathered by executing phase 1 output — filled questionnaire, completed
    findings register, SAST/SCA scan results (SARIF) and CSPM export (ASFF) — then reconciles phase 1
    hypotheses to confirmed / refuted / unresolved, scores with the documented rubric and catalogued base
    rates, and states any AGENTSEC area with no evidence as explicit residual risk. Runs as a RESUME of
    the phase 1 run, so phase 1 is neither re-run nor re-paid.
  depends_on: playbook
  inputs:
    required:
    - findings_template
    - scan_results
    optional:
    - questionnaire
    - cspm_results
    - code_review
    accepts:
      findings_template:
      - xlsx
      questionnaire:
      - xlsx
      scan_results:
      - sarif
      - json
      cspm_results:
      - json
      - asff
      - csv
      code_review:
      - json
      - xlsx
      - sarif
      - md
  produces:
  - aws-ai-security-assessment-report.html
  - aws-ai-security-assessment-deck.html
  - findings register
  - hypothesis reconciliation
  - aws-ai-security-assessment-report.docx
  - aws-ai-security-assessment-deck.pptx
strategy: orchestrated
report: true
tags:
- aws
- agentic-ai
- agentic-ai-lens
- ai-security
- playbook
- assessment
- catalog-grounded
quality:
  challenger: final
  challenger_gate:
    block_below: ADEQUATE
  grounding: true
  gates:
    citation: halt
    format: halt
    grounding: halt
    output_kind: halt
outcome:
  kind: file_artifact
  artifacts:
  - id: playbook_kit
    agent: kit_composer
    format: html
    save_as: aws-ai-security-assessment-kit.html
    download_label: Download Assessor Execution Playbook (.html - internal)
  - id: code_review_sop
    agent: code_review_sop
    format: markdown
    save_as: agentic-code-review.sop.md
    download_label: Download Local Code-Review SOP (.sop.md — run on your own machine)
  - id: report_html
    agent: quality_gate
    format: html
    save_as: aws-ai-security-assessment-report.html
    download_label: Download Final Assessment Report (.html - flagship)
  - id: report_deck
    agent: deck_finalizer
    format: deck
    save_as: aws-ai-security-assessment-deck.html
    download_label: Download Stakeholder Read-out Deck (.html - press F to present)
  - id: playbook_bundle
    agent: playbook_drafter
    format: bundle
    save_as: aws-ai-security-assessment-playbook.zip
    download_label: Download AWS AI Security Assessment Kit (.zip)
  - id: report_bundle
    agent: final_report
    format: bundle
    save_as: aws-ai-security-assessment-report.zip
    download_label: Download Final Report + Deck (.zip)
  - id: workshop_html
    agent: workshop_composer
    format: deck
    save_as: aws-ai-security-assessment-workshop.html
    download_label: Download Design Workshop Deck (.html - phase 1, press F to present)
  - id: report_docx
    agent: word_composer
    format: docx
    save_as: aws-ai-security-assessment-report.docx
    download_label: Download Editable Report (.docx)
  - id: deck_pptx
    agent: pptx_composer
    format: pptx
    save_as: aws-ai-security-assessment-deck.pptx
    download_label: Download Editable Read-out Deck (.pptx)
entry_point: mission_parser
