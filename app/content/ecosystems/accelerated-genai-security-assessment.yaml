    \ gives fragility / convexity / tail_risk. Use tail_risk to distinguish the typical outcome from the\
    \ tail — a fat-tailed risk still warrants mitigation even when most incidents are contained. Express\
    \ this qualitatively; do NOT publish loss figures or ranges.\n\nQUANTIFIED CLAIMS — BASIS IS MANDATORY:\n\
