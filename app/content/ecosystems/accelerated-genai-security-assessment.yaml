    \ count happens not to be\npre-filled is not thereby less significant - in practice it is often the\
    \ largest.\n\n`read_attachment` returns a `scan_digest` for scan files: authoritative per-tool result\n\
    counts (and severity splits) computed over the WHOLE file, not just the excerpt you can\nsee. Use\
    \ it:\n  - Report EVERY tool's total that the digest reports, including the ones the register\n  \
    \  left blank. If a tool ran and found nothing, say zero - that is a result too.\n  - Cite the digest\
