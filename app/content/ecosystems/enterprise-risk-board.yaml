# Deterministic decision engine (docs/spec-decision-engine.md). The synthesizer emits
# scored DECISION ITEMS (dimension values + justification + evidence); the platform computes
# the label per finding and the go/no-go outcome from this rubric — reproducibly — and the
# composer renders the computed result. This encodes the material-vs-blocker cut the
# Regulator's-Eye challenge previously made ad hoc in prose.
decision:
  scored_by: risk_board_synthesizer
  item_noun: finding
  dimensions:
    likelihood:
      type: ordinal
      levels: [low, medium, high]
      desc: "Probability the risk eventuates given the CURRENT design and controls."
    impact:
      type: ordinal
      levels: [low, medium, high]
      desc: "Severity of consequence to customers, the firm, or regulatory standing if it eventuates."
    is_day1_breach:
      type: boolean
      desc: "TRUE only if a SPECIFIC legal/prudential requirement is actually VIOLATED from the moment of go-live under the current design. An obligation merely existing, applying, or being 'in force' is NOT a Day-1 breach. When unsure, choose false."
    enforceability:
      type: ordinal
      levels: [low, medium, high]
      desc: "How directly and severely a regulator can enforce the specific obligation (penalty regime / enforcement history)."
    verifiability:
      use: verifiability
    control_status:
      type: category
      values: [evidenced, partial, absent]
      desc: "evidenced = control demonstrated with sighted evidence; partial = asserted or incomplete; absent = no control in place."
    time_critical:
      type: boolean
      desc: "TRUE only if a HARD EXTERNAL DEADLINE falls at or before go-live that this initiative must meet (e.g. a commenced amendment with a fixed date). An obligation being generally 'in force' is NOT time_critical. When unsure, choose false."
  labels: [blocker, material, minor]
  rubric:
  - label: blocker
    when: "(is_day1_breach and verifiability >= grounded) or (control_status == absent and enforceability >= high) or time_critical"
  - label: material
    when: "impact >= high or likelihood >= high"
  - label: minor
    default: true
  decision:
    outcomes: [NO_GO, GO_WITH_CONDITIONS, GO]
    rule:
    - outcome: NO_GO
      when: "count(label == blocker and status == open) > 0"
    - outcome: GO_WITH_CONDITIONS
      when: "count(label in [blocker, material]) > 0"
    - outcome: GO
      default: true
    conditions_from: [blocker, material]

ecosystem:
  name: enterprise-risk-board
  description: "Board-grade risk interrogation of a proposed decision. The operator (CRO,\nChief Compliance/AI-Risk Officer, or an accountable executive) describes an initiative\nand attaches its evidence pack (business case, solution design, DPIA/PIA, vendor\ncontract, model card, prior committee papers). An intake analyst decomposes it across\nthe enterprise non-financial-risk taxonomy; five domain lenses assess it IN PARALLEL,\ngrounded in authoritative catalogs (financial-regulatory-risk, cyber-security-risk,\nprivacy-au, fcc-au); a Regulator's-Eye challenger adversarially attacks the assessment\nand the proposed mitigations; an accountability mapper assigns every residual risk to a\nFAR accountable person and flags orphans; a synthesizer forms a defensible go / go-with-\nconditions / no-go verdict; and a composer writes the board-ready Risk Interrogation &\nGo/No-Go Memo.\n\nThe deliverable is a DEFENSIBLE QUALITATIVE MEMO — cited to authoritative sources,\nadversarially challenged, human-gated — NOT a numeric risk score. Grounding is deepest\nwhere the catalog is rich (Cyber, Privacy, Regulatory, FCC); uncovered NFR domains are\nassessed by reasoning and marked [catalog-gap]. Conclusions (the verdict, residual\nrisks, owner assignments) are run outputs — never cataloged."
  version: '1.0'
  inputs:
  - id: initiative
    type: text
    label: "Initiative / decision under review (what is proposed — plain English)"
    required: true
  - id: context
    type: text
    label: "Context (business unit, who/what is affected, autonomy/decision authority, scale, timeline, third parties involved)"
    required: true
  - id: accountable_person
    type: text
    label: "Accountable person / role who owns this under FAR (optional — e.g. 'CRO', 'Chief Data & Analytics Officer')"
    required: false
  - id: decision_sought
    type: text
    label: "Decision sought (optional: approve / approve-with-conditions / reject / note)"
    required: false
  - id: supporting_documentation
    type: text
    label: "Supporting documentation (optional: paste text or references — business case, solution design, DPIA/PIA, vendor contract, model card, control descriptions, prior minutes). Files can also be attached at launch."
    required: false
  outcome:
    kind: file_artifact
    audience: the Board Risk & Compliance Committee (non-executive directors, CRO, CCO)
    artifacts:
    - id: board_risk_memo
      agent: board_memo_composer
      format: html
      save_as: board-risk-memo.html
      download_label: Risk Interrogation & Go/No-Go Memo (HTML)
strategy: orchestrated
report: true
# Cap concurrent agents per parallel layer (throttled Map fan-out) so a wide
# swarm doesn't overwhelm Bedrock. 4 = the safe concurrency found in testing.
# depends_on stays purely data/citation; concurrency is controlled here, not by
# the DAG topology.
max_concurrency: 4
quality:
  challenger: per_level
  grounding: true
  external_grounding: true
  challenger_gate:
    block_below: ADEQUATE
