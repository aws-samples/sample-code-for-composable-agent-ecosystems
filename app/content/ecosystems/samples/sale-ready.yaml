ecosystem:
  name: sale-ready
  description: "Pre-sale strategy intelligence for property vendors. Produces a comprehensive\nVendor Strategy Pack — the document a selling agent presents at the listing\nappointment. Covers market positioning, pricing strategy, campaign planning,\npresentation advice, disclosure requirements, and visual assets.\n"
  version: '1.0'
  outcome:
    kind: file_artifact
    artifacts:
    - id: visual_assets
      agent: visual_asset_generator
      format: pdf
      save_as: visual_assets.pdf
      download_label: Visual Assets (Charts & Maps)
    - id: vendor_pack
      agent: vendor_pack_composer
      format: pdf
      save_as: vendor_strategy_pack.pdf
      download_label: Vendor Strategy Pack (PDF)
strategy: orchestrated
report: true
quality:
  challenger: per_level
  grounding: true
  challenger_gate:
    block_below: ADEQUATE
entry_point: property_profiler
memory:
  strategies:
  - semantic
  shared_namespaces:
  - name: property_data
    write:
    - all
    read:
    - all
  - name: market_intel
    write:
    - all
    read:
    - all
  - name: strategy
    write:
    - all
    read:
    - all
  - name: property_catalog
    path: /catalog/property/
    write:
    - property_profiler
    read:
    - all
    auto_persist: true
  - name: suburb_catalog
    path: /catalog/suburb/
    write:
    - suburb_demand_analyst
    read:
    - all
    auto_persist: true
  - name: strata_scheme_catalog
    path: /catalog/strata-scheme/
    write: []
    read:
    - all
    auto_persist: false
  - name: comparable_sale_catalog
    path: /catalog/comparable-sale/
    write:
    - comparable_sales_analyst
    read:
    - all
    auto_persist: true
  - name: selling_agent_catalog
    path: /catalog/selling-agent/
    write: []
    read:
    - all
    auto_persist: false
  - name: development_application_catalog
    path: /catalog/development-application/
    write: []
    read:
    - all
    auto_persist: false
  - name: council_catalog
    path: /catalog/council/
    write: []
    read:
    - all
    auto_persist: false
  - name: planning_precedent_catalog
    path: /catalog/planning-precedent/
    write: []
    read:
    - all
    auto_persist: false
  - name: planning_control_catalog
    path: /catalog/planning-control/
    write: []
    read:
    - all
    auto_persist: false
  - name: service_availability_catalog
    path: /catalog/service-availability/
    write: []
    read:
    - all
    auto_persist: false
  - name: overlay_catalog
    path: /catalog/overlay/
    write:
    - risk_disclosure_analyst
    read:
    - all
