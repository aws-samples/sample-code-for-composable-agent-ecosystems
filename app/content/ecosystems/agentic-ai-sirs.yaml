ecosystem:
  name: agentic-ai-sirs
  description: 'Prepares and produces a complete Security Incident Response Simulation

    (SIRS) workshop package focused on Agentic AI threats. Operator provides

    customer context (industry, agent deployments, tech stack) and workshop

    preferences. Four specialists work in parallel: one maps the OWASP

    Agentic AI Top 10 to the customer''s specific environment, one designs

    executable scenarios grounded in real incidents, one produces deployable

    technical artifacts (Terraform, agent configs, poisoned RAG stores), and

    one designs the facilitation flow. Two synthesizers assemble the master

    execution plan and the customer-facing presentation deck.


    All scenarios are tailored to the customer''s actual agent inventory and

    tech stack. Each scenario maps to a specific OWASP Agentic risk

    (ASI01-ASI10), uses a real analogous incident for credibility, and

    includes both attacker and defender perspectives.

    '
  version: '1.0'
  inputs:
  - id: customer_context
    type: text
    label: Customer context (industry, size, regulator, cloud provider, current or planned AI/agent deployments)
    required: true
  - id: agent_inventory
    type: text
    label: 'Agent inventory (what agents they run or plan to run: purpose, tools, permissions, data access, orchestration pattern)'
    required: true
  - id: workshop_preferences
    type: text
    label: 'Workshop preferences (duration: half-day/full-day, audience: SOC/exec/mixed, format: tabletop/hands-on/hybrid, number of scenarios)'
    required: true
  - id: threat_priorities
    type: text
    label: 'Threat priorities (optional: which OWASP Agentic risks to focus on, e.g. ''ASI01 Goal Hijacking, ASI06 Memory Poisoning''. Leave blank for agents to recommend.)'
    required: false
  outcome:
    kind: file_artifact
    artifacts:
    - id: execution_plan
      agent: workshop_assembler
      format: html
      save_as: sirs-execution-plan.html
      download_label: SIRS Execution Plan (HTML)
    - id: workshop_deck
      agent: presentation_drafter
      format: html
      save_as: sirs-workshop-deck.html
      download_label: Workshop Deck (HTML)
strategy: orchestrated
report: true
# Declare the HTML deliverables the synthesizer agents produce so the UI can surface
# open/download buttons (openReport only opens DECLARED + produced artifacts). Filenames
# must match what the agents save: <agent>/<save_as> under the run's S3 prefix.
outcome:
  kind: file_artifact
  audience: workshop facilitators, security leadership, customer stakeholders
  artifacts:
  - id: execution_plan_html
    agent: workshop_assembler
    format: html
    save_as: sirs-execution-plan.html
    download_label: Download SIRS Execution Plan (HTML)
  - id: presentation_deck_html
    agent: presentation_drafter
    format: html
    save_as: sirs-workshop-deck.html
    download_label: Download SIRS Workshop Deck (HTML)
quality:
